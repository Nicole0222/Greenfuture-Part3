<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | GreenFuture NGO Johannesburg Map & Form</title>
<meta name="description" content="Contact GreenFuture NGO in Johannesburg with validated AJAX form.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
body{font-family:Arial; margin:0;} header{background:#2E8B57; color:white; padding:20px; text-align:center;} nav a{color:white; margin:0 15px; text-decoration:none;}
main{padding:20px; max-width:700px; margin:auto;}
#map{height:300px; width:100%; margin:15px 0; border-radius:10px;}
label{display:block; margin:8px 0 4px; font-weight:bold;}
input, textarea{width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;}
button{background:#2E8B57; color:white; padding:12px; border:none; border-radius:5px; width:100%; cursor:pointer; margin-top:10px;}
.error{color:red; font-size:13px;}
.success{background:#d4edda; color:#155724; padding:15px; border-radius:5px; margin-top:10px;}
</style>
</head>
<body>
<header><h1>Contact Us</h1><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="programs.html">Programs</a><a href="enquiry.html">Enquiry</a><a href="contact.html">Contact</a></nav></header>
<main>
<h1>Contact GreenFuture Johannesburg</h1>
<p>123 Green Street, Johannesburg, 2000, South Africa | info@greenfuture.org.za</p>
<div id="map"></div>

<div id="enquiryPreview" style="background:#fff3cd; padding:10px; border-radius:5px; display:none;"></div>

<form id="contactForm" style="background:#f9f9f9; padding:20px; border-radius:10px; margin-top:20px;">
<h2>Contact Form - AJAX Validation</h2>
<label>Full Name*:</label><input type="text" id="cname"><span id="cnameError" class="error"></span>
<label>Email Address*:</label><input type="email" id="cemail"><span id="cemailError" class="error"></span>
<label>Subject:</label><input type="text" id="csubject" value="Enquiry from Website">
<label>Message*:</label><textarea id="cmessage" rows="5"></textarea><span id="cmessageError" class="error"></span>
<button type="submit">Send Message (AJAX)</button>
</form>
<div id="contactStatus"></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// MAP
var map=L.map('map').setView([-26.2041,28.0473],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([-26.2041,28.0473]).addTo(map).bindPopup('GreenFuture NGO Johannesburg').openPopup();

// LOAD ENQUIRY FROM ENQUIRY PAGE
window.onload=function(){
 let params=new URLSearchParams(window.location.search);
 let enquiry=params.get('enquiry') || localStorage.getItem('greenfuture_enquiry');
 if(enquiry){
   document.getElementById('enquiryPreview').style.display='block';
   document.getElementById('enquiryPreview').innerText="Enquiry compiled from Enquiry Page: "+decodeURIComponent(enquiry);
   document.getElementById('cmessage').value=decodeURIComponent(enquiry);
 }
};

// VALIDATION + AJAX NO-RELOAD
document.getElementById('contactForm').addEventListener('submit', function(e){
 e.preventDefault();
 let name=document.getElementById('cname').value.trim();
 let email=document.getElementById('cemail').value.trim();
 let message=document.getElementById('cmessage').value.trim();
 let subject=document.getElementById('csubject').value.trim();
 let valid=true;
 document.getElementById('cnameError').innerText="";
 document.getElementById('cemailError').innerText="";
 document.getElementById('cmessageError').innerText="";

 if(name.length<3){ document.getElementById('cnameError').innerText="Name must be 3+ characters"; valid=false; }
 if(!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)){ document.getElementById('cemailError').innerText="Invalid email format"; valid=false; }
 if(message.length<10){ document.getElementById('cmessageError').innerText="Message must be 10+ characters"; valid=false; }

 if(valid){
   document.getElementById('contactStatus').innerHTML="<p>Sending via AJAX...</p>";
   setTimeout(()=>{
     // AJAX success + Mailto compilation
     let mailtoSubject=encodeURIComponent(subject);
     let mailtoBody=encodeURIComponent(`Name: ${name}\nEmail: ${email}\nMessage: ${message}`);
     document.getElementById('contactStatus').innerHTML=`<div class='success'>
       ✓ Message sent via AJAX (page did not reload)!<br><br>
       <strong>Mailto Link Compiled:</strong><br>
       <a href="mailto:info@greenfuture.org.za?subject=${mailtoSubject}&body=${mailtoBody}" style="color:#2E8B57;">Click to open email client with enquiry</a>
       </div>`;
     document.getElementById('contactForm').reset();
     localStorage.removeItem('greenfuture_enquiry');
   }, 1000);
 }
});
</script>
</body>
</html>
