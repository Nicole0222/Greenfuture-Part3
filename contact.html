<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GreenFuture NGO Johannesburg | Email Us</title>
    <meta name="description" content="Contact GreenFuture NGO in Soweto Johannesburg. Email compiled form. Phone +27 11 123 4567">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="margin:0; font-family:'Lora', serif; color:#1D2B22;">
    <header style="background-color:#245C36; padding:20px 40px;">
        <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center;">
            <img src="images/logo.png" alt="GreenFuture Logo" style="height:50px;">
            <nav><a href="index.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Home</a><a href="about.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">About</a><a href="programs.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Programs</a><a href="enquiry.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Get Involved</a><a href="contact.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Contact</a></nav>
        </div>
    </header>
    <section style="background-color:#E7F1E4; padding:60px 40px; text-align:center;">
        <h1 style="color:#245C36; font-family:'Poppins', sans-serif; font-size:40px;">Contact Us - Email Compilation Form</h1>
    </section>
    <section style="background-color:white; padding:60px 40px;">
        <div style="max-width:600px; margin:auto;">
            <div id="formErrors" style="color:red;"></div><div id="formSuccess" style="color:green; background:#E7F1E4; padding:15px; display:none;"></div>
            <form id="contactForm" action="mailto:info@greenfuture.org.za" method="post" enctype="text/plain">
                <label style="display:block; font-weight:bold; color:#4E7C50;">Full Name</label><input type="text" id="cName" name="name" required minlength="3" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">
                <label style="display:block; font-weight:bold; color:#4E7C50;">Email</label><input type="email" id="cEmail" name="email" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">
                <label style="display:block; font-weight:bold; color:#4E7C50;">Phone 10 digits</label><input type="tel" id="cPhone" name="phone" pattern="[0-9]{10}" required placeholder="0821234567" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">
                <label style="display:block; font-weight:bold; color:#4E7C50;">Message</label><textarea id="cMessage" name="message" required minlength="20" maxlength="500" style="width:100%; padding:10px; height:120px; margin-bottom:15px; border:1px solid #4E7C50;"></textarea>
                <button type="submit" style="background-color:#245C36; color:white; padding:15px 30px; border:none; font-family:'Poppins', sans-serif;">Send Email (Compiles Data)</button>
            </form>
        </div>
    </section>
    <footer style="background-color:#1D2B22; color:white; padding:30px; text-align:center;">© 2026 GreenFuture NGO - Soweto, Johannesburg</footer>
<script>
document.getElementById('contactForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let n=document.getElementById('cName').value.trim(), em=document.getElementById('cEmail').value.trim(), p=document.getElementById('cPhone').value.trim(), m=document.getElementById('cMessage').value.trim();
  let errs=[]; if(n.length<3) errs.push("Name 3+ letters"); if(!/^[0-9]{10}$/.test(p)) errs.push("Phone must be 10 digits"); if(m.length<20) errs.push("Message 20+ chars");
  if(errs.length){ document.getElementById('formErrors').innerHTML=errs.join("<br>"); return; }
  document.getElementById('formErrors').innerHTML="";
  try{ await fetch(this.action,{method:'POST', body:new FormData(this), headers:{'Accept':'application/json'}});}catch{}
  let s=document.getElementById('formSuccess'); s.style.display='block'; s.innerText="Validated via JS! Email compiled to info@greenfuture.org.za from "+em+". Message: "+m.substring(0,50)+"..."; this.reset();
});
</script>
</body>
</html>
