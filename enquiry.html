<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - GreenFuture NGO | Volunteer, Donate, Partner Cost Calculator</title>
    <meta name="description" content="Enquire about volunteering, donations, partnerships at GreenFuture Johannesburg. Calculate cost: R50 per tree, R200 per workshop.">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="margin:0; font-family:'Lora', serif; color:#1D2B22;">
    <header style="background-color:#245C36; padding:20px 40px;">
        <div style="max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center;">
            <img src="images/logo.png" alt="GreenFuture Logo" style="height:50px;">
            <nav><a href="index.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Home</a><a href="about.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">About</a><a href="programs.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Programs</a><a href="enquiry.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Get Involved</a><a href="contact.html" style="color:white; margin:0 15px; text-decoration:none; font-family:'Poppins', sans-serif;">Contact</a></nav>
        </div>
    </header>

    <section style="background-color:#E7F1E4; padding:60px 40px; text-align:center;">
        <h1 style="color:#245C36; font-family:'Poppins', sans-serif; font-size:40px;">Get Involved - Enquiry with Cost Calculator</h1>
    </section>

    <section style="background-color:#F1F7EE; padding:60px 40px;">
        <div style="max-width:600px; margin:auto;">
            <h2 style="color:#245C36; font-family:'Poppins', sans-serif; text-align:center;">Enquiry Form</h2>
            <div id="formErrors" style="color:red; margin-bottom:10px;"></div>
            <div id="formSuccess" style="color:green; background:white; padding:15px; display:none; border-left:5px solid #245C36;"></div>
            
            
            <form id="enquiryForm" action="https://formspree.io/f/mayvloke" method="POST" style="margin-top:20px;">
                <label style="display:block; font-weight:bold; color:#4E7C50;">Full Name</label>
                <input type="text" id="enqName" name="name" required minlength="3" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">
                
                <label style="display:block; font-weight:bold; color:#4E7C50;">Email</label>
                <input type="email" id="enqEmail" name="email" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">

                <label style="display:block; font-weight:bold; color:#4E7C50;">Enquiry Type</label>
                <select id="enqType" name="type" required style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">
                    <option value="">Select</option><option value="volunteer">Volunteer</option><option value="donation">Donation - Trees</option><option value="workshop">Sponsor Workshop</option><option value="partner">Partner</option>
                </select>

                <label style="display:block; font-weight:bold; color:#4E7C50;">Quantity (Trees / Hours)</label>
                <input type="number" id="enqQty" name="qty" min="1" value="1" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #4E7C50;">

                <label style="display:block; font-weight:bold; color:#4E7C50;">Message (20+ chars)</label>
                <textarea id="enqMessage" name="message" required minlength="20" style="width:100%; padding:10px; height:100px; margin-bottom:15px; border:1px solid #4E7C50;"></textarea>

                <button type="submit" style="background-color:#245C36; color:white; padding:15px 30px; border:none; font-family:'Poppins', sans-serif;">Submit Enquiry (AJAX)</button>
            </form>
        </div>
    </section>
    <footer style="background-color:#1D2B22; color:white; padding:30px; text-align:center;">© 2026 GreenFuture NGO</footer>

<script>
function validate(n,e,m){ let err=[]; if(n.length<3) err.push("Name must be 3+ letters"); if(!e.includes('@')) err.push("Email invalid"); if(m.length<20) err.push("Message must be 20+ chars, now "+m.length); return err; }
document.getElementById('enquiryForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let n=document.getElementById('enqName').value.trim(), em=document.getElementById('enqEmail').value.trim(), t=document.getElementById('enqType').value, q=document.getElementById('enqQty').value||1, m=document.getElementById('enqMessage').value.trim();
  let er=validate(n,em,m); if(er.length){ document.getElementById('formErrors').innerHTML=er.join("<br>"); return; }
  document.getElementById('formErrors').innerHTML="";
  let resp=""; if(t==='donation') resp=`Thanks ${n}! Donation: R50 x ${q} trees = R${50*q}. Availability: Can plant this week. Email to ${em}`; else if(t==='workshop') resp=`Thanks ${n}! Workshop sponsorship: R200 x ${q} = R${200*q}. Available in Soweto schools.`; else if(t==='volunteer') resp=`Hi ${n}, Volunteer slot open Saturday, you offered ${q} hours. We will email ${em}`; else resp=`Thanks ${n}, Partner enquiry received. We will contact ${em}`;
  try{ await fetch(this.action,{method:'POST', body:new FormData(this), headers:{'Accept':'application/json'}});}catch{}
  let s=document.getElementById('formSuccess'); s.style.display='block'; s.innerHTML="<h3>Enquiry Processed via AJAX - No Page Reload</h3><p>"+resp+"</p>"; this.reset();
});
</script>
</body>
</html>
